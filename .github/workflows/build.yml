name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # postinstall이 frontend deps 도 설치하므로 별도 step 불필요.
      - name: Install dependencies
        run: npm install

      - name: Build frontend (static export)
        run: npm run build:frontend

      - name: Verify frontend build
        shell: bash
        run: test -f frontend/out/index.html && echo "OK" || exit 1

      # macOS: PNG → ICNS 자동 변환이 가끔 깨지므로 sips/iconutil로 명시 생성
      - name: Generate macOS .icns icon
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cd build
          if [ -f icon.icns ]; then
            echo "icon.icns already present, skipping."
            exit 0
          fi
          rm -rf icon.iconset
          mkdir -p icon.iconset
          sips -z 16 16     icon.png --out icon.iconset/icon_16x16.png      >/dev/null
          sips -z 32 32     icon.png --out icon.iconset/icon_16x16@2x.png   >/dev/null
          sips -z 32 32     icon.png --out icon.iconset/icon_32x32.png      >/dev/null
          sips -z 64 64     icon.png --out icon.iconset/icon_32x32@2x.png   >/dev/null
          sips -z 128 128   icon.png --out icon.iconset/icon_128x128.png    >/dev/null
          sips -z 256 256   icon.png --out icon.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256   icon.png --out icon.iconset/icon_256x256.png    >/dev/null
          sips -z 512 512   icon.png --out icon.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512   icon.png --out icon.iconset/icon_512x512.png    >/dev/null
          cp icon.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns
          rm -rf icon.iconset
          file icon.icns

      # macOS: zip만 생성 (DMG는 hdiutil detach 실패 회피를 위해 완전 차단)
      - name: Build Electron app (macOS - zip only)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac zip --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build Electron app (Windows - nsis)
        if: matrix.platform == 'win'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: bash
        run: ls -la dist-app/ || true

      # macOS는 zip만, Windows는 exe만 업로드 (dmg/blockmap 일체 제외)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-creator-${{ matrix.platform }}
          path: |
            dist-app/*.zip
            dist-app/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
